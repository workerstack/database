name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:strict
      # the release's publish path on every push, with the release's npm, so it is red on main before a tag ever runs it
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: dry-run the release publish
        run: |
          packed="$(.github/scripts/pack-for-publish.sh packages/core)"
          # npm refuses even a dry run of a version it has, so the candidate goes as a prerelease no one installs
          (cd "$packed" && npm pkg set version="$(npm pkg get version | tr -d '"')-dry-run")
          npm publish "$packed" --dry-run --ignore-scripts --tag dry-run

  # test:coverage runs in three shards and the coverage job below merges them: one job took 20.2 minutes of
  # test:coverage in run 42044117817, and the same files took 1.23x (run 42056901545) and 1.53x (run 42076507764) as
  # long on slower runners, so a single job's timeout was a bet on the runner. A shard holds a third of the files, so
  # 20 minutes is twice the slowest runner's share and still catches a hang; test:bun has its own job below
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: database_test
          POSTGRES_PASSWORD: database_test
          POSTGRES_USER: database_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U database_test -d database_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Postgres suites are required here; tests/integration/support/pg.ts fails the run when it is unset.
      DATABASE_TEST_PG_URL: postgres://database_test:database_test@localhost:5432/database_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # vitest runs on Node; Miniflare's workerd and the pg drivers are exercised there
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # each DROP DATABASE forces a checkpoint, slow under fsync; tests/integration/support/pg-fsync.ts says why
      - name: test Postgres without fsync
        run: |
          PGPASSWORD=database_test psql -h localhost -U database_test -d database_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off" -c "SELECT pg_reload_conf()"
      # The Atlas suites are required here; tests/integration/support/atlas.ts fails the run without it.
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      # The remote libsql suites are required here; tests/support/sqld.ts fails the run without the pinned
      # binary at its path, and checks the binary's own sha256 on every start.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: sqld-cache
        with:
          path: ~/.cache/database-test/sqld/0.24.32
          key: sqld-0.24.32-x86_64-linux-gnu
      - name: install sqld 0.24.32
        if: steps.sqld-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/database-test/sqld/0.24.32
          cd ~/.cache/database-test/sqld/0.24.32
          curl -sSfL -o sqld.tar.xz https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.32/libsql-server-x86_64-unknown-linux-gnu.tar.xz
          echo "71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f  sqld.tar.xz" | sha256sum -c -
          tar -xJf sqld.tar.xz
      # The Atlas floor cell is required here; tests/support/atlas-floor.ts fails it without the pinned
      # v1.2.0 at its path, the oldest Atlas database's ATLAS_RANGE admits.
      - name: install atlas v1.2.0
        run: |
          mkdir -p "$HOME/.cache/database-test/atlas/1.2.0"
          curl -sSfL -o "$HOME/.cache/database-test/atlas/1.2.0/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.2.0
          echo "c12b889e3349f0e5610aec32fe327e5a6911a0e472754a0c381c30c7c0630e88  $HOME/.cache/database-test/atlas/1.2.0/atlas" | sha256sum -c -
          chmod +x "$HOME/.cache/database-test/atlas/1.2.0/atlas"
      # a shard sees only its own tests, so the thresholds are off here; the coverage job holds every file to the
      # config's perFile 100% over all three shards' blobs
      - run: bun run test:coverage --shard=${{ matrix.shard }}/3 --reporter=default --reporter=blob --coverage.thresholds.perFile=false --coverage.thresholds.lines=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: packages/core/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # the gate on coverage: vitest merges the shards' coverage before it checks vitest.config.ts's thresholds, so a file
  # whose tests fall in different shards is held to 100% over all of them, as one unsharded run held it
  coverage:
    name: coverage
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-blob-*
          path: packages/core/.vitest-reports/
          merge-multiple: true
      - run: bun run test:coverage --merge-reports

  test-bun:
    name: test (bun)
    runs-on: ubuntu-latest
    # test:bun ran 3-6s in runs 41293589626 and 41333028493, after ~20s of setup; the Postgres
    # service's health check may take up to 60s (12 retries, 5s apart), so 5 minutes still catches a hang
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: database_test
          POSTGRES_PASSWORD: database_test
          POSTGRES_USER: database_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U database_test -d database_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Postgres suites are required here; tests/integration/support/pg.ts fails the run when it is unset.
      DATABASE_TEST_PG_URL: postgres://database_test:database_test@localhost:5432/database_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # each DROP DATABASE forces a checkpoint, slow under fsync; tests/integration/support/pg-fsync.ts says why
      - name: test Postgres without fsync
        run: |
          PGPASSWORD=database_test psql -h localhost -U database_test -d database_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off" -c "SELECT pg_reload_conf()"
      # The Atlas suites are required here; tests/integration/support/atlas.ts fails the run without it.
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run test:bun

  # lists and the D1 proof built by the tip and by the published 0.21.0 and 0.20.1, held to the engine's own answer over
  # generated cases (packages/core/tests/differential): the fixed seeds, and one fresh seed it prints. It installs the
  # releases from the npm registry. test:differential ran 99 s locally on a machine at load 30 of 16 cores, the D1
  # proof (46 s) and D1 local's list walks (35 s) the longest; the plan holds the job under 3 minutes, and 6 still
  # catches a hang after the Postgres service's 60 s health check
  differential:
    name: differential
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: database_test
          POSTGRES_PASSWORD: database_test
          POSTGRES_USER: database_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U database_test -d database_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # every suite job gets the Postgres service and its URL (tests/structure/workflows.test.ts), as one may come to need it
      DATABASE_TEST_PG_URL: postgres://database_test:database_test@localhost:5432/database_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # vitest runs on Node; Miniflare's workerd runs D1 local, and each version's check runs its proof child on node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # each DROP DATABASE forces a checkpoint, slow under fsync; tests/integration/support/pg-fsync.ts says why
      - name: test Postgres without fsync
        run: |
          PGPASSWORD=database_test psql -h localhost -U database_test -d database_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off" -c "SELECT pg_reload_conf()"
      # the proof suite hashes each case's migrations directory with the real Atlas, as a D1 project's atlas.sum is made
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run test:differential

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: database_test
          POSTGRES_PASSWORD: database_test
          POSTGRES_USER: database_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U database_test -d database_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # postgres.e2e.test.ts is required here: tests/integration/support/pg.ts fails the run when it is unset.
      DATABASE_TEST_PG_URL: postgres://database_test:database_test@localhost:5432/database_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # vitest runs on Node; the apps run the database binary under bun, as users do
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # each DROP DATABASE forces a checkpoint, slow under fsync; tests/integration/support/pg-fsync.ts says why
      - name: test Postgres without fsync
        run: |
          PGPASSWORD=database_test psql -h localhost -U database_test -d database_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off" -c "SELECT pg_reload_conf()"
      # migrate diff runs the real Atlas
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run --filter @workerstack/database test:e2e

  consumers:
    name: consumers (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # database's floor, the first Node with node:sqlite as a built-in (it type-strips, so tsx needs no flag there either), and the current one
        node: ["22.13", "24"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: database_test
          POSTGRES_PASSWORD: database_test
          POSTGRES_USER: database_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U database_test -d database_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # the missing-peer cells run database migrate check against a real Postgres
      DATABASE_TEST_PG_URL: postgres://database_test:database_test@localhost:5432/database_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # each DROP DATABASE forces a checkpoint, slow under fsync; tests/integration/support/pg-fsync.ts says why
      - name: test Postgres without fsync
        run: |
          PGPASSWORD=database_test psql -h localhost -U database_test -d database_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off" -c "SELECT pg_reload_conf()"
      # database migrate check runs Atlas there, as it does in a consumer's project
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run --filter @workerstack/database test:consumers

  # the suites where real processes and paths meet, on macOS too (tests/support/posix.ts)
  posix:
    name: posix (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # vitest runs on Node, as on Linux
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # the migrate suites run the real Atlas; macOS has shasum, not sha256sum
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-darwin-arm64-v1.3.0
          echo "47aaf7c295c7569c7eecfcbc53f02de862846ce1fbef16f1bd8ae98b03c3c68f  $RUNNER_TEMP/atlas/atlas" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run --filter @workerstack/database test:posix
